[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robustcompute"
version = "0.1.0"
description = "Adaptive inference routing under dynamic resource constraints"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["robustcompute*"]